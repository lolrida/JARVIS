name: iOS app

# Builds the iPhone app on a GitHub-hosted Mac, so you don't need one.
# Produces an unsigned JARVIS.ipa you can download (Actions tab -> latest run -> Artifacts)
# and install from Windows or a Mac with Sideloadly or AltStore. See the README.
# Run it by hand from the Actions tab with "Run workflow", or it runs on every change to ios/.

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build JARVIS.ipa
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write   # to publish JARVIS.ipa on the "ios-latest" release
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project ios/JARVIS.xcodeproj \
            -target JARVIS \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1
          status=$?
          echo "---- errors and warnings ----"
          grep -E "(error|warning):" build.log | sort -u | head -150 || true
          echo "---- tail ----"
          tail -5 build.log
          exit $status

      - name: Package JARVIS.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/JARVIS.app out/Payload/
          cd out && zip -qry JARVIS.ipa Payload && ls -lh JARVIS.ipa

      - name: Upload JARVIS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ipa
          path: out/JARVIS.ipa
          retention-days: 90

      - name: Publish to the "ios-latest" release (direct download link, no login needed)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ios-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/ios-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create ios-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "JARVIS iPhone app (latest build)" \
              --notes "Unsigned build of the JARVIS iPhone app, updated automatically on every change. Install it with Sideloadly or AltStore: see the README."
          fi
          gh release upload ios-latest out/JARVIS.ipa --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/ios-latest/JARVIS.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
